<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    color: #fff;
}

/* Page container */
.page {
    width: 100%;
    max-width: 420px;
    padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
}

/* Title */
.video-title {
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    margin: 10px 0 12px;
}

/* Top Ad */
.ad-top {
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
}

/* Video wrapper */
.video-wrapper {
    position: relative;
    width: 100%;
    height: 72vh;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 30px rgba(0,0,0,.6);
    cursor: pointer;
}

/* Gradient overlay */
.video-wrapper::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.18),
        rgba(0,0,0,0),
        rgba(0,0,0,.28)
    );
    pointer-events: none;
}

/* Video */
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Block fullscreen button (iOS) */
video::-webkit-media-controls-fullscreen-button {
    display: none !important;
}

/* Desktop tweak */
@media (min-width: 768px) {
    .video-wrapper {
        height: 560px;
    }
}

<script>
const video = document.querySelector("video");

/* Tap to unmute + show controls */
video.addEventListener("click", () => {
    video.muted = !video.muted;
    video.controls = true;
});

/* Autoplay fallback */
video.play().catch(()=>{});

/* Extra fullscreen protection */
video.addEventListener("webkitbeginfullscreen", e => e.preventDefault());
document.addEventListener("fullscreenchange", () => {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
});
</script>
